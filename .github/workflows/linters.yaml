---
name: Run pre-commit hooks

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev
  workflow_dispatch:

jobs:
  run-linter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - uses: actions/setup-python@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: pre-commit/action@v3.0.1
