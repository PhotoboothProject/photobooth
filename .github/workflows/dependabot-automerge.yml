---
name: Dependabot patch auto-merge

on:
  pull_request_target:
    branches:
      - dev
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  contents: write
  pull-requests: write

jobs:
  enable-auto-merge:
    if: >-
      github.repository == 'PhotoboothProject/photobooth' &&
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - name: Read Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@d7267f607e9d3fb96fc2fbe83e0af444713e90b7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-patch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          ready=$(gh api graphql -f query='
            query {
              repository(owner: "PhotoboothProject", name: "photobooth") {
                autoMergeAllowed
                ref(qualifiedName: "refs/heads/dev") {
                  branchProtectionRule {
                    requiresStatusChecks
                    requiresStrictStatusChecks
                    requiredStatusCheckContexts
                  }
                }
              }
            }' --jq '.data.repository |
              .autoMergeAllowed and (.ref.branchProtectionRule |
                .requiresStatusChecks and .requiresStrictStatusChecks and
                (.requiredStatusCheckContexts | length > 0))')
          if [ "$ready" != true ]; then
            echo '::notice::Auto-merge needs repository auto-merge and strict required CI checks on dev.'
            exit 0
          fi
          gh pr merge --auto --merge --match-head-commit "$PR_HEAD" "$PR_URL"
